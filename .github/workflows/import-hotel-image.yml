name: Import hotel projection

on:
  push:
    paths:
      - ".github/workflows/import-hotel-image.yml"

permissions:
  contents: write

jobs:
  import-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download architectural projection
        run: |
          mkdir -p assets/photos/hero
          curl -L --fail --retry 3             "https://images.ladepeche.fr/api/v1/images/view/6abbbd3f46460a4c5507f110/large/image.jpg?v=1"             -o assets/photos/hero/hotel-projection.jpg
          test -s assets/photos/hero/hotel-projection.jpg

      - name: Commit projection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/photos/hero/hotel-projection.jpg
          git diff --cached --quiet && exit 0
          git commit -m "V19: ajouter la projection de l'hôtel"
          git push origin main
